# Local-dev DNS for controlled-test.example, used only inside the docker-compose network
# defined in ../docker-compose.yml. Real deployment (the VPS) uses real DNS records
# instead - see ../../deploy/DEPLOY.md. Addresses below are the static IPs assigned to
# each origin container in docker-compose.yml; keep the two in sync if either changes.
no-resolv
server=8.8.8.8

# Root document + IPv6-capable CDN host -> the "pass" origin (dual-stack, everything works).
address=/controlled-test.example/172.28.0.10
address=/controlled-test.example/fd00:d0c5::10
address=/static.controlled-test.example/172.28.0.10
address=/static.controlled-test.example/fd00:d0c5::10

# v6-tcp-fail -> AAAA is advertised, but that address refuses TCP connections.
address=/v6-tcp-fail.controlled-test.example/172.28.0.11
address=/v6-tcp-fail.controlled-test.example/fd00:d0c5::11

# v6-tls-fail -> AAAA is advertised and TCP connects, but TLS never completes.
address=/v6-tls-fail.controlled-test.example/172.28.0.12
address=/v6-tls-fail.controlled-test.example/fd00:d0c5::12

# v6-http-fail -> AAAA is advertised, TCP+TLS work, but HTTP always returns 500.
address=/v6-http-fail.controlled-test.example/172.28.0.13
address=/v6-http-fail.controlled-test.example/fd00:d0c5::13

# v4only-img -> deliberately NO AAAA record at all (no address6 line for this name).
address=/v4only-img.controlled-test.example/172.28.0.14
