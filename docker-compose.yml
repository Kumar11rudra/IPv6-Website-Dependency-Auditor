services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - AUDITOR_CORS_ORIGINS=*
      - AUDITOR_MAX_CONCURRENT_SCANS=4
      - AUDITOR_SIMULATE_IPV6=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
